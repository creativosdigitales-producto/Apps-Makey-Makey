/* ===== SALA ===== */

}

}
#window{ position:absolute; left:1080px; top:110px; width:240px; height:180px; background:#29adff; border:12px solid #f4f4f4; box-shadow:0 0 0 6px #1a1c2c, 8px 8px 0 6px rgba(26,28,44,.25); overflow:hidden; }
#window::before{ content:""; position:absolute; left:50%; top:0; bottom:0; width:10px; margin-left:-5px; background:#f4f4f4; }
#window::after{ content:""; position:absolute; left:0; right:0; top:50%; height:10px; margin-top:-5px; background:#f4f4f4; }
.cloud{ position:absolute; height:18px; background:#fff; box-shadow:12px -12px 0 #fff, 24px 0 0 #fff; }

.bracket{ position:absolute; top:426px; width:16px; height:40px; background:#6b3a1e; }

#objects{ position:absolute; inset:0; }
.obj{ position:absolute; cursor:pointer; outline:none; }
.obj .spr{ position:relative; z-index:2; }
.obj:hover .spr,.obj:focus-visible .spr{ transform:translateY(-6px); }
.obj:focus-visible .spr{ filter:drop-shadow(0 0 0 #fff) drop-shadow(4px 0 0 #fff) drop-shadow(-4px 0 0 #fff) drop-shadow(0 4px 0 #fff) drop-shadow(0 -4px 0 #fff); }
.obj .shadow{ position:absolute; left:8%; right:8%; bottom:-10px; height:14px; background:rgba(26,28,44,.28); z-index:1; }
.obj .tag{ position:absolute; left:50%; bottom:calc(100% + 14px); transform:translateX(-50%); white-space:nowrap; font-size:14px; background:#1a1c2c; color:#fff; padding:8px 10px; display:none; z-index:20; box-shadow:4px 4px 0 rgba(0,0,0,.3); pointer-events:none; }
.obj:hover .tag,.obj:focus-visible .tag{ display:block; }
.obj.elec .spr{ animation:glow 1.4s steps(4) infinite; }
@keyframes glow{ 0%,100%{ filter:drop-shadow(0 0 0 rgba(255,236,39,0)); } 50%{ filter:drop-shadow(0 0 10px rgba(255,236,39,.85)); } }
.plug{ position:absolute; bottom:0; z-index:3; pointer-events:none; }
.bolt{ position:absolute; z-index:4; pointer-events:none; animation:zap 1s steps(2) infinite; }
@keyframes zap{ 0%{ transform:translateY(0); opacity:1; } 50%{ transform:translateY(-6px); opacity:.35; } }
.obj.ok, .obj.bad{ cursor:default; }
.obj.ok .spr{ animation:none; filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 12px rgba(0,228,54,.9)); }
.obj.ok .bolt{ animation:none; }
.obj.bad .spr{ filter:grayscale(1) brightness(.85); animation:shake .4s steps(4) 1; }
@keyframes shake{ 0%,100%{ transform:translateX(0);} 25%{ transform:translateX(-10px);} 75%{ transform:translateX(10px);} }
.badge{ position:absolute; left:50%; top:-10px; transform:translate(-50%,-100%); z-index:6; animation:pop .35s steps(3) 1; }
@keyframes pop{ 0%{ transform:translate(-50%,-60%) scale(.3);} 100%{ transform:translate(-50%,-100%) scale(1);} }

/* ===== PERSONAJE Y GLOBO ===== */
#hero{ position:absolute; left:70px; bottom:40px; z-index:8; animation:bob 1.2s steps(2) infinite; }

.bubble{ position:absolute; background:#fff; color:#1a1c2c; font-size:18px; line-height:1.7; padding:20px 22px;

#gBubble{ left:40px; bottom:300px; width:330px; min-height:120px; z-index:9; }

/* ===== HUD ===== */
#hud{ position:absolute; left:0; right:0; top:0; height:84px; background:#1a1c2c; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 28px; z-index:10; box-shadow:0 6px 0 #29366f; }
#hud h1{ font-size:22px; margin:0; color:#ffec27; text-shadow:4px 4px 0 #b13e53; font-weight:normal; }
.hud-mid{ display:flex; align-items:center; gap:14px; font-size:22px; }
.hud-right{ display:flex; align-items:center; gap:22px; }
#hearts{ display:flex; gap:10px; }
.btn-mini{ font-family:inherit; text-transform:uppercase; font-size:12px; background:#333c57; color:#fff; border:none; padding:12px 14px; cursor:pointer; box-shadow:inset -4px -4px 0 #1a1c2c, inset 4px 4px 0 #566c86; }
.btn-mini:focus-visible{ outline:4px solid #ffec27; }

/* ===== PANTALLAS ===== */
.screen{ position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center; background:rgba(26,28,44,.72); }
.screen.show{ display:flex; }
.btn{ font-family:inherit; text-transform:uppercase; font-size:24px; color:#1a1c2c; background:#ffec27; border:none; padding:22px 30px; cursor:pointer;

.btn:focus-visible{ outline:6px solid #29adff; outline-offset:10px; }
.btn.red{ background:#ff6b7a; box-shadow:inset -6px -6px 0 #c4003d, inset 6px 6px 0 #ffb3bb, 0 0 0 6px #1a1c2c, 0 12px 0 6px #1a1c2c; color:#fff; text-shadow:3px 3px 0 #1a1c2c; }

#intro .title{ position:absolute; top:70px; left:0; right:0; text-align:center; font-size:52px; color:#ffec27; text-shadow:6px 6px 0 #b13e53, 12px 12px 0 #1a1c2c; letter-spacing:2px; }
#intro .sub{ position:absolute; top:160px; left:0; right:0; text-align:center; font-size:16px; color:#a0e8ff; }
#introHero{ position:absolute; left:250px; bottom:150px; animation:bob 1.2s steps(2) infinite; }
#iBubble{ left:640px; top:290px; width:760px; min-height:250px; font-size:24px; line-height:1.8; padding:34px 38px; }
#iBubble .tail{ left:-30px; top:120px; box-shadow:-6px 0 0 #fff, -12px 0 0 #fff,0 -6px 0 #1a1c2c,0 6px 0 #1a1c2c, -6px -6px 0 #1a1c2c, -6px 6px 0 #1a1c2c, -12px -6px 0 #1a1c2c,-12px 6px 0 #1a1c2c,-18px 0 0 #1a1c2c; }
#iText{ min-height:130px; }
.hintrow{ display:flex; align-items:center; gap:18px; margin-top:14px; }
#iNav{ position:absolute; left:640px; top:660px; display:flex; gap:30px; align-items:center; }
.dots{ display:flex; gap:12px; margin-left:20px; }
.dots i{ width:16px; height:16px; background:#566c86; display:block; }
.dots i.on{ background:#ffec27; }

.panel{ position:relative; background:#f4f4f4; width:880px; padding:48px 50px 60px; text-align:center;
  box-shadow:0 0 0 8px #1a1c2c, inset -8px -8px 0 #c2c3c7, inset 8px 8px 0 #fff, 16px 16px 0 8px rgba(0,0,0,.35); }
.panel h2{ margin:0 0 26px; font-size:46px; font-weight:normal; }
.panel p{ font-size:20px; line-height:1.8; margin:0 0 30px; }
#win h2{ color:#008751; text-shadow:5px 5px 0 #a8f0b8; }
#lose h2{ color:#c4003d; text-shadow:5px 5px 0 #ffc2cb; }
.row{ display:flex; justify-content:center; align-items:flex-end; gap:24px; margin-bottom:26px; }
#confetti{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
#confetti i{ position:absolute; top:-30px; width:16px; height:16px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(980px) rotate(720deg); } }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001s !important; animation-iteration-count:1 !important; }
}
</style>
</head>

<script>
/* ---------- PALETA ---------- */
const P={k:'#1a1c2c',w:'#f4f4f4',g:'#c2c3c7',G:'#8b8b9b',d:'#5f574f',D:'#3a3640',b:'#29adff',B:'#1d6fd1',N:'#1d2b53',
s:'#ffccaa',S:'#e8a87c',r:'#ff004d',R:'#a3002f',o:'#ffa300',y:'#ffec27',Y:'#fff6a8',n:'#ab5236',m:'#6b3a1e',
l:'#00e436',L:'#008751',c:'#a0e8ff',p:'#ff77a8',v:'#83769c',t:'#e4bb85',u:'#6fd3ff'};

function mk(w,h,draw,scale){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d');
  const R=(col,a,b,ww,hh)=>{x.fillStyle=P[col]||col; x.fillRect(a,b,ww,hh);};
  const D=(col,cx,cy,r)=>{x.fillStyle=P[col]||col; for(let j=0;j<h;j++)for(let i=0;i<w;i++){const dx=i+.5-cx,dy=j+.5-cy; if(dx*dx+dy*dy<=r*r)x.fillRect(i,j,1,1);}};
  draw(R,D);
  c.style.width=w*scale+'px'; c.style.height=h*scale+'px';
  return c;
}
function fromStr(rows,scale,swap){
  return mk(rows[0].length,rows.length,(R)=>{rows.forEach((row,j)=>[...row].forEach((ch,i)=>{ if(ch!=='.'){ R(swap&&swap[ch]?swap[ch]:ch,i,j,1,1);} }));},scale);
}

heroBase[6]=face("sssssssss"); heroBase[7]=face("sskssskss"); heroBase[8]=face("sskssskss");
const heroIdle=heroBase.slice(); heroIdle[9]=face("psssksssp");

const heroHappy=heroBase.slice(); heroHappy[7]=face("skksssKKs".replace(/K/g,'k')); heroHappy[8]=face("sssssssss"); heroHappy[9]=face("pskkkkksp");

function Hero(el,scale){
  this.frames=[fromStr(heroIdle,scale),fromStr(heroTalk,scale),fromStr(heroHappy,scale)];

Hero.prototype.set=function(i){ if(this.cur===i)return; this.cur=i; this.el.innerHTML=''; this.el.appendChild(this.frames[i]); };

const BOLT=["...kkkk","..kyyyk","..kyyk.",".kyyk..",".kyyykk","kyyyyyk","kkkyyk.","..kyk..","..kk...","..k...."];

 {id:'fridge',name:'EL REFRIGERADOR',elec:1,size:'big',w:16,h:30,why:'NECESITA ELECTRICIDAD PARA ENFRIAR.',draw:(R)=>{

/* ---------- SONIDO ---------- */
let AC=null, soundOn=true;
function beep(f,t,d,type='square',vol=.06){ if(!soundOn)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type;o.frequency.value=f; g.gain.value=vol; o.connect(g);g.connect(AC.destination); const s=AC.currentTime+t; o.start(s); g.gain.setValueAtTime(vol,s); g.gain.exponentialRampToValueAtTime(.0001,s+d); o.stop(s+d+.02);}catch(e){} }
const sfx={
  ok:()=>{beep(660,0,.08);beep(880,.08,.08);beep(1320,.16,.14);},
  bad:()=>{beep(180,0,.18,'sawtooth',.05);beep(130,.16,.25,'sawtooth',.05);},
  win:()=>{[523,659,784,1047,784,1047].forEach((f,i)=>beep(f,i*.13,.16));},
  lose:()=>{[392,330,262,196].forEach((f,i)=>beep(f,i*.2,.24,'triangle',.08));},
  blip:()=>beep(990,0,.03,'square',.025)
};

/* ---------- ESCALA 16:9 ---------- */
const stage=document.getElementById('stage'), wrap=document.getElementById('wrap');
function fit(){ const s=Math.min(wrap.clientWidth/1600, wrap.clientHeight/900); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();

/* ---------- TEXTO TIPO MÁQUINA ---------- */
function typer(el,hero){
  let timer=null;
  return function(txt,done){
    clearInterval(timer); el.textContent=''; let i=0;
    timer=setInterval(()=>{
      i+=1; el.textContent=txt.slice(0,i);
      if(hero) hero.set(i%4<2?1:0);
      if(i%3===0) sfx.blip();
      if(i>=txt.length){ clearInterval(timer); if(hero) hero.set(0); done&&done(); }
    },28);
  };
}

/* ---------- ESTADO ---------- */
const hero=new Hero(document.getElementById('hero'),9);
const introHero=new Hero(document.getElementById('introHero'),16);
const sayGame=typer(document.getElementById('gText'),hero);
const sayIntro=typer(document.getElementById('iText'),introHero);
const gBubble=document.getElementById('gBubble');
document.getElementById('hudBolt').appendChild(fromStr(BOLT,4));

let total=0, found=0, errors=0, over=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));

function drawHearts(){
  const h=document.getElementById('hearts'); h.innerHTML='';
  for(let i=0;i<3;i++) h.appendChild(fromStr(HEART,7, i<3-errors?null:{r:'D',w:'D'}));
}
function updCount(){ document.getElementById('count').textContent=found+' / '+total; }

function buildRoom(){
  const box=document.getElementById('objects'); box.innerHTML='';
  const nE=rnd(6,8);                       // ENTRE 6 Y 8 OBJETOS CON ELECTRICIDAD
  const fb=rnd(Math.max(2,nE-6),Math.min(6,nE)), sb=nE-fb;
  const pick=(f,n)=>shuffle(OBJS.filter(f)).slice(0,n);
  const floor=shuffle([...pick(o=>o.elec&&o.size==='big',fb),...pick(o=>!o.elec&&o.size==='big',7-fb)]);
  const shelf=shuffle([...pick(o=>o.elec&&o.size==='small',sb),...pick(o=>!o.elec&&o.size==='small',6-sb)]);
  total=nE; found=0; errors=0; over=false;
  floor.forEach((o,i)=>place(box,o,420+i*172,860,6,true));
  shelf.forEach((o,i)=>place(box,o,480+i*192,400,5,false));
  drawHearts(); updCount();
}

function place(box,o,cx,baseY,scale,onFloor){
  const el=document.createElement('div');
  el.className='obj'+(o.elec?' elec':''); el.tabIndex=0;
  el.setAttribute('role','button'); el.setAttribute('aria-label',o.name);
  const W=o.w*scale, H=o.h*scale;
  el.style.left=(cx-W/2)+'px'; el.style.top=(baseY-H)+'px'; el.style.width=W+'px'; el.style.height=H+'px';
  const spr=mk(o.w,o.h,o.draw,scale); spr.className='spr'; el.appendChild(spr);
  if(onFloor){ const sh=document.createElement('div'); sh.className='shadow'; el.appendChild(sh); }
  const tag=document.createElement('div'); tag.className='tag'; tag.textContent=o.name; el.appendChild(tag);
  if(o.elec){
    const plug=fromStr(PLUG,4); plug.classList.add('plug'); plug.style.left=(W-6)+'px'; el.appendChild(plug);
    const bolt=fromStr(BOLT,3); bolt.classList.add('bolt'); bolt.style.left=(W+20)+'px'; bolt.style.bottom='30px'; el.appendChild(bolt);
  }
  const act=()=>choose(o,el);
  el.addEventListener('click',act);
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); }});
  box.appendChild(el);
}

function badge(el,rows){ const b=fromStr(rows,6); b.classList.add('badge'); el.appendChild(b); }

function choose(o,el){
  if(over||el.classList.contains('ok')||el.classList.contains('bad')) return;
  const verb=o.pl?'USAN':'USA';
  if(o.elec){
    el.classList.add('ok'); badge(el,CHECK); found++; updCount(); sfx.ok();
    gBubble.className='bubble good';
    sayGame(`¡MUY BIEN! ${o.name} ${verb} ELECTRICIDAD. ${o.why}`);
    if(found===total){ over=true; setTimeout(showWin,1100); }
  }else{
    el.classList.add('bad'); badge(el,XMARK); errors++; drawHearts(); sfx.bad();
    gBubble.className='bubble bad';
    sayGame(`¡UY! ${o.name} NO ${verb} ELECTRICIDAD. ${o.why}`);
    if(errors>=3){ over=true; setTimeout(showLose,1100); }
  }
}

function showWin(){
  hero.set(2); document.getElementById('hero').classList.add('jump'); sfx.win();
  const st=document.getElementById('stars'); st.innerHTML='';
  const n=3-errors;
  for(let i=0;i<3;i++) st.appendChild(fromStr(STAR,i===1?11:8, i<n?null:{y:'G'}));
  document.getElementById('winText').innerHTML=`ENCONTRASTE LOS ${total} OBJETOS QUE USAN ELECTRICIDAD.<br>${errors===0?'¡SIN NINGÚN ERROR! ERES UN EXPERTO.':'¡ERES UN GRAN DETECTIVE DE LA ENERGÍA!'}`;
  const cf=document.getElementById('confetti'); cf.innerHTML='';
  const cols=['#ffec27','#29adff','#ff004d','#00e436','#ff77a8','#ffa300'];
  for(let i=0;i<60;i++){ const c=document.createElement('i'); c.style.left=Math.random()*1600+'px'; c.style.background=cols[i%cols.length]; c.style.animationDuration=(1.8+Math.random()*2)+'s'; c.style.animationDelay=(Math.random()*.8)+'s'; cf.appendChild(c); }
  document.getElementById('win').classList.add('show');
  document.getElementById('againBtn').focus();
}
function showLose(){
  sfx.lose();
  const lh=document.getElementById('loseHearts'); lh.innerHTML='';
  for(let i=0;i<3;i++) lh.appendChild(fromStr(HEART,9,{r:'D',w:'D'}));
  document.getElementById('lose').classList.add('show');
  document.getElementById('retryBtn').focus();
}

function startGame(){
  ['win','lose','intro'].forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById('hero').classList.remove('jump'); hero.cur=null; hero.set(0);
  buildRoom();
  gBubble.className='bubble';
  sayGame(`BUSCA LOS ${total} OBJETOS QUE USAN ELECTRICIDAD. ¡HAZ CLIC EN ELLOS!`);
}

/* ---------- INTRO ---------- */
const pages=[
  '¡HOLA, EXPLORADOR! BIENVENIDO A MI SALA. ¡NECESITO TU AYUDA!',
  'AQUÍ HAY MUCHOS OBJETOS. ALGUNOS USAN ELECTRICIDAD Y OTROS NO.',
  'TU MISIÓN: HAZ CLIC EN TODOS LOS OBJETOS QUE USAN ELECTRICIDAD.',
  'PISTA: LOS QUE USAN ELECTRICIDAD BRILLAN Y TIENEN UN RAYITO EN EL ENCHUFE. ¡CUIDADO! SI TE EQUIVOCAS 3 VECES, PIERDES.'
];
let page=0;
const dots=document.getElementById('dots'), iNext=document.getElementById('iNext'), iHint=document.getElementById('iHint');
function showPage(){
  dots.innerHTML=pages.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join('');
  iNext.textContent= page===pages.length-1 ? '¡A JUGAR!' : 'SIGUIENTE';
  iHint.innerHTML='';
  if(page===pages.length-1){
    const row=document.createElement('div'); row.className='hintrow';
    const plug=fromStr(PLUG,6); const bolt=fromStr(BOLT,5); bolt.style.animation='zap 1s steps(2) infinite';
    row.appendChild(plug); row.appendChild(bolt); iHint.appendChild(row);
  }
  sayIntro(pages[page]);
}
iNext.addEventListener('click',()=>{ sfx.blip(); if(page<pages.length-1){ page++; showPage(); } else startGame(); });
document.getElementById('againBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);
const sndBtn=document.getElementById('sndBtn');
sndBtn.addEventListener('click',()=>{ soundOn=!soundOn; sndBtn.textContent='SONIDO: '+(soundOn?'SÍ':'NO'); });

buildRoom(); showPage();
</script>
