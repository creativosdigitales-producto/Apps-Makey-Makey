<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASTRO EN LA LUNA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --space:#141133; --deep:#0c0a22; --ink:#231e3d; --moon:#d8d2e4; --rock:#5e5784;
  --sun:#ffd84a; --sun-dark:#d9a82a; --ice:#7fe6ff; --alien:#7be36a; --text:#ffffff; --danger:#ff6b8a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; --space:#141133; --deep:#0c0a22; } }
:root[data-theme="dark"]{ color-scheme:dark; --space:#141133; --deep:#0c0a22; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--deep);color:var(--text);font-family:"Press Start 2P",ui-monospace,"Courier New",monospace;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform-origin:0 0;overflow:hidden;
  background:var(--space);image-rendering:pixelated;border-radius:6px}
#cv{position:absolute;inset:0;width:1280px;height:640px;image-rendering:pixelated}
.hidden{display:none!important}

/* barra superior */
#hud{position:absolute;left:24px;top:16px;width:1032px;height:56px;display:flex;align-items:center;gap:14px}
.chip{background:var(--ink);border:4px solid #3b3561;box-shadow:0 4px 0 #0c0a22;padding:10px 14px;font-size:16px;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:10px}
#lvName{flex:1;overflow:hidden;text-overflow:ellipsis;color:var(--ice)}
#matChip img{width:28px;height:28px;image-rendering:pixelated}
#matChip.done{color:var(--alien)}

/* columna derecha */
#side{position:absolute;left:1072px;top:14px;width:194px;height:612px;display:flex;flex-direction:column;align-items:center;gap:8px}
#logo{position:absolute;right:22px;top:14px;width:144px;z-index:40;background:#fff;border:4px solid var(--ink);box-shadow:0 0 0 4px #3b3561,0 8px 0 4px #0c0a22;padding:6px;border-radius:4px}
#logo img{display:block;width:100%;height:auto}
#side .spacer{height:184px;flex:none}
#side .sbtn{width:180px;font-size:12px;line-height:1.2;padding:10px 4px;white-space:nowrap;overflow:hidden;box-shadow:inset -4px -4px 0 #a79fbf,0 4px 0 var(--ink)}
#hint{font-size:11px;line-height:1.7;text-align:center;color:var(--moon);margin-top:2px}
#dpad{position:absolute;left:19px;bottom:2px;width:156px;height:156px}
.pad{position:absolute;width:52px;height:52px;padding:0;background:var(--moon);border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 #a79fbf,0 5px 0 var(--ink);cursor:pointer;display:grid;place-items:center}
.pad::after{content:"";width:22px;height:22px;background:var(--rock);clip-path:polygon(50% 8%,96% 88%,4% 88%)}
.pad:active,.pad.on{transform:translateY(4px);box-shadow:inset -4px -4px 0 #a79fbf,0 1px 0 var(--ink);background:var(--sun)}
#pU{left:52px;top:0} #pD{left:52px;top:104px} #pL{left:0;top:52px} #pR{left:104px;top:52px}
#pD::after{transform:rotate(180deg)} #pL::after{transform:rotate(-90deg)} #pR::after{transform:rotate(90deg)}
#dpad .mid{position:absolute;left:52px;top:52px;width:52px;height:52px;background:var(--ink)}

/* botones */
.btn{font-family:inherit;font-size:20px;color:var(--ink);background:var(--sun);border:4px solid var(--ink);
  box-shadow:inset -5px -5px 0 var(--sun-dark),0 6px 0 var(--ink);padding:16px 26px;cursor:pointer;line-height:1.2;
  transition:transform .08s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:inset -5px -5px 0 var(--sun-dark),0 2px 0 var(--ink)}
.btn.alt{background:var(--moon);box-shadow:inset -5px -5px 0 #a79fbf,0 6px 0 var(--ink)}
.btn.alt.sbtn{box-shadow:inset -4px -4px 0 #a79fbf,0 4px 0 var(--ink)}
.btn:focus-visible,.pad:focus-visible,.lvl:focus-visible{outline:4px solid var(--ice);outline-offset:4px}

/* pantallas */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center}
#title{padding-right:200px}
#title h1{margin:0;font-size:58px;line-height:1.15;text-align:center;font-weight:400;color:#fff;
  text-shadow:4px 4px 0 var(--rock),8px 8px 0 var(--ink)}
#title .sub{margin:22px 0 0;font-size:18px;color:var(--sun);text-shadow:3px 3px 0 var(--ink)}
#heroRow{display:flex;align-items:center;gap:40px;margin-bottom:26px}
#hero{width:160px;height:140px;image-rendering:pixelated;animation:float 2.4s ease-in-out infinite}
#heroAlien{width:84px;image-rendering:pixelated;animation:float 1.8s ease-in-out infinite reverse}
#heroGem{width:70px;image-rendering:pixelated;animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.row{display:flex;gap:22px;margin-top:40px}
#keys{margin-top:30px;font-size:12px;color:var(--moon);line-height:1.8;text-align:center}

#levels{background:rgba(12,10,34,.82);padding-right:200px}
#levels h2{margin:0 0 34px;font-size:30px;font-weight:400;text-shadow:4px 4px 0 var(--rock)}
#grid{display:grid;grid-template-columns:repeat(5,140px);gap:22px}
.lvl{font-family:inherit;height:120px;background:var(--moon);color:var(--ink);border:4px solid var(--ink);
  box-shadow:inset -5px -5px 0 #a79fbf,0 6px 0 #000;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:30px}
.lvl:hover{transform:translateY(-2px)}
.lvl .st{display:flex;gap:4px}
.lvl .st img{width:22px;height:22px;image-rendering:pixelated}
.lvl.lock{background:#3b3561;color:#6f68a0;cursor:not-allowed;box-shadow:inset -5px -5px 0 #2a2550,0 6px 0 #000}
.lvl.lock span.n{font-size:14px}

/* ventanas */
.modal{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;background:rgba(12,10,34,.55);padding-right:200px}
.card{background:var(--ink);border:6px solid var(--moon);box-shadow:0 0 0 6px var(--ink),0 14px 0 6px #000;padding:34px 48px;text-align:center;max-width:820px;
  animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.card h3{margin:0 0 18px;font-size:34px;font-weight:400;color:var(--sun);text-shadow:4px 4px 0 #000;line-height:1.3}
.card p{margin:0 0 14px;font-size:16px;line-height:1.8;color:var(--moon)}
.card .big{font-size:20px;color:#fff}
.card .mission{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px 0 8px;font-size:18px;color:var(--ice)}
.card .mission img{width:44px;height:44px;image-rendering:pixelated}
#stars{display:flex;justify-content:center;gap:16px;margin:10px 0 24px}
#stars img{width:64px;height:64px;image-rendering:pixelated;opacity:.2;transform:scale(.6);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
#stars img.on{opacity:1;transform:none}
.card .row{margin-top:16px;justify-content:center}
.card .btn{font-size:16px;padding:14px 20px}

#toast{position:absolute;left:24px;width:1032px;top:290px;z-index:15;text-align:center;pointer-events:none}
#toast span{display:inline-block;background:var(--danger);color:#fff;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  padding:14px 22px;font-size:20px;line-height:1.5;animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
#toast span.good{background:var(--alien);color:var(--ink)}

/* festejo final */
#final{z-index:35;padding-right:200px;background:rgba(12,10,34,.25)}
#fwBanner{background:#ff6b8a;border:6px solid var(--ink);box-shadow:0 10px 0 var(--ink);padding:22px 70px 20px;
  clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);animation:drop .7s cubic-bezier(.3,1.5,.5,1) both}
#fwTitle{display:flex;font-size:44px;line-height:1}
#fwTitle span{display:inline-block;color:#fff;text-shadow:4px 4px 0 var(--ink);animation:wave 1.1s ease-in-out infinite,tint 2.4s steps(1) infinite}
@keyframes drop{from{transform:translateY(-320px) rotate(-6deg)}to{transform:none}}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes tint{0%{color:#fff}25%{color:var(--sun)}50%{color:var(--ice)}75%{color:var(--alien)}}
#finRow{display:flex;align-items:flex-end;gap:36px;margin:30px 0 6px;height:150px}
#finAstro{width:130px;image-rendering:pixelated;animation:jump .8s ease-in-out infinite}
#finA1,#finA2{width:70px;image-rendering:pixelated;animation:jump .8s ease-in-out infinite .4s}
#finGem{width:56px;image-rendering:pixelated;animation:spin 1.6s steps(8) infinite}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.08,.92)}15%{transform:translateY(0) scale(1)}50%{transform:translateY(-46px) scale(.95,1.05)}}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
#final .fsub{margin:10px 0 0;font-size:20px;color:#fff;text-shadow:3px 3px 0 var(--ink)}
#final .fsub2{margin:14px 0 0;font-size:16px;color:var(--sun);text-shadow:3px 3px 0 var(--ink)}
#finStars{display:flex;align-items:center;gap:14px;margin-top:20px;font-size:22px;background:var(--ink);border:4px solid #3b3561;padding:10px 18px}
#finStars img{width:40px;height:40px;image-rendering:pixelated}
#final .row{margin-top:24px}
#final .btn{font-size:16px;padding:14px 20px}
@media (prefers-reduced-motion: reduce){#fwBanner,#fwTitle span,#finAstro,#finA1,#finA2,#finGem{animation:none}}
@media (prefers-reduced-motion: reduce){#hero,#heroAlien,#heroGem{animation:none}.card,#toast span{animation:none}}
</style>
</head>

function makeSprite(rows, swap={}, px=1, outline="#1a1630"){
  const h=rows.length, w=Math.max(...rows.map(r=>r.length));
  const c=document.createElement("canvas"); c.width=(w+2)*px; c.height=(h+2)*px;

  g.fillStyle=outline;
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){

  return c;

function tone(f,dur,type="square",vol=.05,delay=0,f2=0){
  if(muted||!ac)return;
  const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}

function loadLevel(i){
  cur=i; const def=LEVELS[i];
  const rows=def.map.length, cols=Math.max(...def.map.map(r=>r.length));
  const T=Math.floor(Math.min((AREA.w-40)/cols,(AREA.h-30)/rows,96));
  const ox=Math.floor(AREA.x+(AREA.w-cols*T)/2), oy=Math.floor(AREA.y+(AREA.h-rows*T)/2);
  const grid=[], mats=[], aliens=[]; let start={x:1,y:1};
  for(let y=0;y<rows;y++){ grid[y]=[]; for(let x=0;x<cols;x++){
    const ch=def.map[y][x]||"-";
    if(ch==="-"){grid[y][x]=0;continue;}
    if(ch==="#"){grid[y][x]=1;continue;}
    grid[y][x]=2;
    if(ch==="S")start={x,y};
    if(ch==="M")mats.push({x,y,got:false,ph:Math.random()*6});
    if(ch==="A")aliens.push({x,y,rx:x,ry:y,dx:0,dy:0,move:false});
    if(ch==="H")aliens.push({x,y,rx:x,ry:y,dx:1,dy:0,move:true});
    if(ch==="V")aliens.push({x,y,rx:x,ry:y,dx:0,dy:1,move:true});
  }}
  L={def,rows,cols,T,ox,oy,grid,mats,aliens,start,
     p:{x:start.x,y:start.y,fx:start.x,fy:start.y,t:1,face:1,bob:0},
     hits:0,alienClock:0,done:false,mat:matOf(i)};
  L.bg=renderMaze(L);
  particles=[];prints=[];
  updateHUD();
}
function rand(seed){ let s=seed*9301+49297; return ()=>{ s=(s*9301+49297)%233280; return s/233280; }; }
function renderMaze(L){
  const {rows,cols,T,grid}=L, c=document.createElement("canvas"); c.width=cols*T+40; c.height=rows*T+40;
  const g=c.getContext("2d"), P=Math.max(2,Math.round(T/12)), O=20;
  const solid=(x,y)=>y>=0&&y<rows&&x>=0&&x<cols&&grid[y][x]>0;
  // halo y contorno de la zona
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(solid(x,y)){ g.fillStyle="#3b3561"; g.fillRect(O+x*T-P*4,O+y*T-P*4,T+P*8,T+P*8); }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++) if(solid(x,y)){ g.fillStyle="#1a1630"; g.fillRect(O+x*T-P,O+y*T-P,T+P*2,T+P*2); }
  for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
    const X=O+x*T,Y=O+y*T, r=rand(x*31+y*17+3);
    if(grid[y][x]===2){
      g.fillStyle=(x+y)%2?"#d8d2e4":"#cec7dc"; g.fillRect(X,Y,T,T);
      if(r()<.45){ // cráter
        const cx=X+Math.floor(r()*(T-P*6))+P, cy=Y+Math.floor(r()*(T-P*5))+P, s=P*(r()<.5?3:4);
        g.fillStyle="#b4abc8"; g.fillRect(cx+P,cy,s-P*2,P); g.fillRect(cx,cy+P,s,s-P*2); g.fillRect(cx+P,cy+s-P,s-P*2,P);
        g.fillStyle="#ebe7f3"; g.fillRect(cx+P,cy+s-P*2,s-P*2,P);
      }
      if(r()<.6){ g.fillStyle="#bfb7d1"; g.fillRect(X+Math.floor(r()*(T-P)),Y+Math.floor(r()*(T-P)),P,P); }
    } else if(grid[y][x]===1){
      g.fillStyle="#5e5784"; g.fillRect(X,Y,T,T);
      if(!solid(x,y-1)||grid[y-1][x]!==1){ g.fillStyle="#857ead"; g.fillRect(X,Y,T,P*2); }
      g.fillStyle="#7a73a3"; g.fillRect(X+P*2,Y+P*3,P*3,P*2); g.fillRect(X+T-P*5,Y+T-P*6,P*2,P*2);
      g.fillStyle="#463f6b"; g.fillRect(X,Y+T-P*2,T,P*2); g.fillRect(X+T-P*4,Y+P*4,P*2,P);
      if(r()<.5){ g.fillStyle="#4d4674"; g.fillRect(X+Math.floor(r()*(T-P*4)),Y+Math.floor(T/2),P*3,P*2); }
    }
  }
  // sombra interior bajo las rocas
  for(let y=1;y<rows;y++)for(let x=0;x<cols;x++) if(grid[y][x]===2&&grid[y-1][x]===1){ g.fillStyle="rgba(40,30,80,.22)"; g.fillRect(O+x*T,O+y*T,T,P*2); }
  // marca de inicio
  const s=L.start; g.fillStyle="rgba(127,230,255,.35)"; g.fillRect(O+s.x*T+P*2,O+s.y*T+T-P*4,T-P*4,P*2);
  return c;
}

function firework(x,y){

/* ================== MOVIMIENTO ================== */
const DIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
const walk=(x,y)=>L && y>=0&&y<L.rows&&x>=0&&x<L.cols&&L.grid[y][x]===2;
function tryMove(d){
  const p=L.p, [dx,dy]=DIRS[d];
  if(dx)p.face=dx;
  const nx=p.x+dx, ny=p.y+dy;
  if(!walk(nx,ny)){ sfx.bump(); p.bumpX=dx; p.bumpY=dy; p.bumpT=1; return; }
  prints.push({x:p.x,y:p.y,dx,dy,t:now});
  p.fx=p.x; p.fy=p.y; p.x=nx; p.y=ny; p.t=0; sfx.step();
  checkHit();
}
function checkHit(){
  if(L.done||inputLock)return;
  const p=L.p;
  if(L.aliens.some(a=>a.x===p.x&&a.y===p.y)){ caught(); return; }
  const m=L.mats.find(m=>!m.got&&m.x===p.x&&m.y===p.y);
  if(m){
    m.got=true; sfx.collect(); burst(m.x,m.y,["#ffd84a","#8eeaff","#ffffff"]);
    updateHUD();
    if(L.mats.every(m=>m.got)) finishLevel();
    else {const f=L.mats.filter(m=>!m.got).length; toast(`${L.mat.say} ${f===1?"FALTA 1":"FALTAN "+f}`,true);}
  }
}
function caught(){
  inputLock=true; L.hits++; sfx.hit(); shake=14; flash=1;
  burst(L.p.x,L.p.y,["#c78bff","#7be36a","#ff6b8a"]);
  toast("¡UPS! UN ALIEN. VUELVES AL INICIO");
  setTimeout(()=>{
    if(!L)return;
    const p=L.p; p.x=p.fx=L.start.x; p.y=p.fy=L.start.y; p.t=1; p.blink=1;
    held=null; queued=null; inputLock=false;
  },800);
}
function alienStep(){
  for(const a of L.aliens){
    if(!a.move)continue;
    const blocked=(x,y)=>!walk(x,y)||(x===L.start.x&&y===L.start.y)||L.mats.some(m=>!m.got&&m.x===x&&m.y===y)||L.aliens.some(b=>b!==a&&!b.move&&b.x===x&&b.y===y);
    let nx=a.x+a.dx, ny=a.y+a.dy;
    if(blocked(nx,ny)){ a.dx*=-1; a.dy*=-1; nx=a.x+a.dx; ny=a.y+a.dy; if(blocked(nx,ny))continue; }
    a.fx=a.x; a.fy=a.y; a.x=nx; a.y=ny; a.t=0;
    if(!inputLock&&!L.done&&a.x===L.p.x&&a.y===L.p.y) caught();
  }
}

function cellCenter(x,y){ return [L.ox+x*L.T+L.T/2, L.oy+y*L.T+L.T/2]; }

  for(let k=0;k<26;k++){ const a=Math.random()*Math.PI*2, s=1.5+Math.random()*4;
    particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,c:cols[k%cols.length],s:4+Math.floor(Math.random()*3)*2,g:.08}); } }
function confetti(){ particles.push({x:AREA.x+Math.random()*AREA.w,y:AREA.y-20-Math.random()*120,vx:(Math.random()-.5)*2,vy:1+Math.random()*3,life:2.2,
  c:["#ffd84a","#8eeaff","#7be36a","#c78bff","#ff6b8a"][Math.floor(Math.random()*5)],s:8,g:.03}); }

const stars=[]; { const r=rand(7); for(let i=0;i<170;i++) stars.push({x:Math.floor(r()*1280),y:Math.floor(r()*640),s:r()<.15?4:2,p:r()*6}); }
const bgCanvas=(()=>{
  const c=document.createElement("canvas"); c.width=1280; c.height=640; const g=c.getContext("2d");
  g.fillStyle="#141133"; g.fillRect(0,0,1280,640);
  for(let y=0;y<640;y+=8){ g.fillStyle=`rgba(60,40,120,${(y/640)*.35})`; g.fillRect(0,y,1280,8); }
  // Tierra pixelada
  const ex=150,ey=520,R=58,P=6;
  for(let y=-R;y<=R;y+=P)for(let x=-R;x<=R;x+=P){ if(x*x+y*y>R*R)continue;
    const n=Math.sin(x*.09+1)*Math.cos(y*.11)+Math.sin((x+y)*.05);
    g.fillStyle = n>.55?"#5fd46a":"#3a8ee6"; if(x+y>R*.6)g.fillStyle=n>.55?"#3c9b4e":"#2a63b8";
    if(Math.abs(y+20)<P&&x<10&&x>-40)g.fillStyle="#ffffff";
    g.fillRect(ex+x,ey+y,P,P); }
  // horizonte lunar al pie
  for(let x=0;x<1280;x+=8){ const h=26+Math.round(Math.sin(x*.013)*8+Math.sin(x*.041)*4); g.fillStyle="#2b2552"; g.fillRect(x,640-h,8,h); g.fillStyle="#3b3468"; g.fillRect(x,640-h,8,4); }
  return c;
})();

/* ================== DIBUJO ================== */
function drawSpr(img,x,y,w,h){ ctx.drawImage(img,Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function draw(dt){
  ctx.drawImage(bgCanvas,0,0);
  for(const s of stars){ const a=.35+.65*Math.abs(Math.sin(now/900+s.p)); ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fillRect(s.x,s.y,s.s,s.s); }
  if(!L) { drawParticles(dt); return; }
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=.86; if(shake<.5)shake=0; }
  const {T,ox,oy}=L;
  ctx.drawImage(L.bg,ox-20,oy-20);
  // huellas
  prints=prints.filter(f=>now-f.t<2600);
  for(const f of prints){ const a=1-(now-f.t)/2600, P=Math.max(2,Math.round(T/14));
    ctx.fillStyle=`rgba(120,108,150,${a*.55})`;
    const cx=ox+f.x*T+T/2, cy=oy+f.y*T+T/2;
    if(f.dx){ ctx.fillRect(cx-P*2,cy-P*2,P*2,P); ctx.fillRect(cx+P,cy+P,P*2,P); }
    else { ctx.fillRect(cx-P*2,cy-P,P,P*2); ctx.fillRect(cx+P,cy+P,P,P*2); } }
  // materiales
  for(const m of L.mats){ if(m.got)continue;
    const img=IMG[L.mat.img], b=Math.sin(now/300+m.ph)*T*.06, sc=T*.62/Math.max(img.width,img.height);
    const w=img.width*sc,h=img.height*sc, X=ox+m.x*T+(T-w)/2, Y=oy+m.y*T+(T-h)/2+b;
    ctx.fillStyle="rgba(40,30,80,.25)"; ctx.fillRect(ox+m.x*T+T*.28,oy+m.y*T+T*.8,T*.44,T*.08);
    drawSpr(img,X,Y,w,h);
    const tw=(now/180+m.ph)%6; if(tw<1.2){ const P=Math.max(2,Math.round(T/16)); ctx.fillStyle="#fff";
      const sx=X+w*.85, sy=Y+h*.1; ctx.fillRect(sx,sy-P,P,P*3); ctx.fillRect(sx-P,sy,P*3,P); } }
  // aliens
  const frame=Math.floor(now/350)%2;
  for(const a of L.aliens){
    if(a.t!==undefined&&a.t<1){ a.t=Math.min(1,a.t+dt/260); } 
    const k=a.t===undefined?1:ease(a.t), x=a.fx!==undefined?a.fx+(a.x-a.fx)*k:a.x, y=a.fy!==undefined?a.fy+(a.y-a.fy)*k:a.y;
    const img = a.move ? (frame?IMG.walkB:IMG.walkA) : (frame?IMG.alienB:IMG.alienA);
    const sc=T*.74/img.width, w=img.width*sc, h=img.height*sc, hop=a.move?Math.abs(Math.sin(now/180))*T*.05:Math.sin(now/400)*T*.03;
    ctx.fillStyle="rgba(40,30,80,.28)"; ctx.fillRect(ox+x*T+T*.22,oy+y*T+T*.84,T*.56,T*.08);
    drawSpr(img,ox+x*T+(T-w)/2,oy+y*T+(T-h)/2-hop-T*.04,w,h);
  }
  // astronauta
  const p=L.p; if(p.t<1)p.t=Math.min(1,p.t+dt/140);
  const k=ease(p.t); let x=p.fx+(p.x-p.fx)*k, y=p.fy+(p.y-p.fy)*k;
  if(p.bumpT>0){ x+=p.bumpX*.12*p.bumpT; y+=p.bumpY*.12*p.bumpT; p.bumpT=Math.max(0,p.bumpT-dt/120); }
  const img=p.face<0?IMG.astroL:IMG.astro, sc=T*.8/img.width, w=img.width*sc, h=img.height*sc;
  const hop = p.t<1 ? Math.sin(p.t*Math.PI)*T*.12 : Math.sin(now/500)*T*.02;
  let visible=true; if(p.blink>0){ p.blink-=dt/1000; visible=Math.floor(now/90)%2===0; }
  ctx.fillStyle="rgba(40,30,80,.3)"; ctx.fillRect(ox+x*T+T*.2,oy+y*T+T*.86,T*.6,T*.08);
  if(visible && !(inputLock&&flash>0&&!L.done&&Math.floor(now/70)%2)) drawSpr(img,ox+x*T+(T-w)/2,oy+y*T+(T-h)/2-hop-T*.05,w,h);
  ctx.restore();
  if(flash>0){ ctx.fillStyle=`rgba(255,107,138,${flash*.28})`; ctx.fillRect(0,0,1280,640); flash=Math.max(0,flash-dt/500); }
  drawParticles(dt);
}
function drawParticles(dt){
  particles=particles.filter(q=>q.life>0);
  for(const q of particles){ q.x+=q.vx; q.y+=q.vy; q.vy+=q.g; q.life-=dt/900;
    ctx.globalAlpha=Math.max(0,Math.min(1,q.life)); ctx.fillStyle=q.c; ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s); }
  ctx.globalAlpha=1;
}
const ease=t=>1-(1-t)*(1-t);

/* ================== BUCLE ================== */
let last=performance.now();
function loop(t){
  const dt=Math.min(50,t-last); last=t; now=t;
  if(screen==="play"&&L&&!L.done){
    L.alienClock+=dt;
    const speed = cur<7 ? 720 : 620;
    if(!inputLock && L.alienClock>=speed){ L.alienClock=0; alienStep(); }
    if(!inputLock && L.p.t>=1){ const d=queued||held; if(d){ queued=null; tryMove(d); } }
  }
  if(screen==="final"){
    fwClock+=dt;
    if(fwClock>650){ fwClock=0; firework(); }
    if(Math.random()<.35) confetti();
  }
  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================== CONTROLES ================== */
addEventListener("keydown",e=>{
  if(DIRS[e.key]){ e.preventDefault();
    if(screen==="play"&&!$("intro").classList.contains("hidden")){ beginPlay(); return; }
    if(screen==="play"&&!inputLock){ held=e.key; queued=e.key; }
    return; }
  if((e.key==="r"||e.key==="R")&&screen==="play"&&L&&!L.done){ startLevel(cur); }
  if(e.key==="Escape"&&screen!=="title"){ goTitle(); }
});
addEventListener("keyup",e=>{ if(e.key===held)held=null; });
addEventListener("blur",()=>{held=null;});
addEventListener("pointerdown",audio,{passive:true});
addEventListener("keydown",audio);
[["pU","ArrowUp"],["pD","ArrowDown"],["pL","ArrowLeft"],["pR","ArrowRight"]].forEach(([id,key])=>{
  const b=$(id);
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); b.classList.add("on"); if(screen==="play"&&!inputLock){ held=key; queued=key; } });
  const up=()=>{ b.classList.remove("on"); if(held===key)held=null; };
  b.addEventListener("pointerup",up); b.addEventListener("pointerleave",up); b.addEventListener("pointercancel",up);
});
$("bPlay").onclick=()=>{ sfx.click(); startLevel(Math.min(9,save.unlocked-1)); };
$("bLevels").onclick=()=>{ sfx.click(); goLevels(); };
$("bBack").onclick=()=>{ sfx.click(); goTitle(); };
$("bGo").onclick=beginPlay;
$("bMenu").onclick=()=>{ sfx.click(); goLevels(); };
$("bMenu2").onclick=()=>{ sfx.click(); goLevels(); };
$("bRetry").onclick=()=>{ sfx.click(); startLevel(cur); };
$("bAgain").onclick=()=>{ sfx.click(); startLevel(cur); };
$("bNext").onclick=()=>{ sfx.click(); startLevel(cur===9?0:cur+1); };
$("bFinAgain").onclick=()=>{ sfx.click(); clearInterval(showFinal.h); startLevel(0); };
$("bFinMenu").onclick=()=>{ sfx.click(); clearInterval(showFinal.h); goLevels(); };
$("bSound").onclick=()=>{ muted=!muted; try{localStorage.setItem("astro-luna-mute",muted?"1":"0");}catch(e){} setSoundLabel(); audio(); sfx.click(); };
document.querySelectorAll("button").forEach(b=>b.addEventListener("keydown",e=>{ if(DIRS[e.key])e.preventDefault(); }));

$("hero").src=dataURL.astro; $("heroAlien").src=dataURL.walkA; $("heroGem").src=dataURL.gem;
goTitle(); $("bPlay").focus();
</script>
